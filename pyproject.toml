[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "woweekend"
version = "0.1.0"
description = "Lightweight orchestration for repeatable race-weekend workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["wodata", "wostrategy", "wostanding"]

[project.scripts]
woweekend-quali = "woweekend.cli.qualifying:main"
woweekend-race = "woweekend.cli.race:main"
woweekend-post = "woweekend.cli.post:main"

[tool.hatch.build.targets.wheel]
packages = ["src/woweekend"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
